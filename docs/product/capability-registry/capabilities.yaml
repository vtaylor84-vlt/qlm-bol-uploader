capabilities:
  - id: access-identity
    name: Access and identity
    userProblem: Drivers and admins need secure company-scoped access.
    intendedOutcome: Roster-verified session with tenant isolation.
    productDomain: access
    uiLocation: /login
    audience: shared
    productionStatus: partial
    productionBehavior: Email roster login; bridge admins; sessionStorage profile.
    comingSoonBehavior: MFA/SSO shown as future in vision docs only.
    showcaseBehavior: Grant mint on admin login; Showcase entry separate.
    ownership: owned
    canonicalRecords: [Driver, UserIdentity, Carrier, Role, Permission]
    permissions: Roster eligibility; BRIDGE_ADMINS for admin.
    auditRequirements: Login verify events; no secrets in client logs.
    offlineRequirements: Session may persist briefly offline; privileged writes require online.
    integrationDependencies: []
    activationCriteria: Existing roster path remains Live.
    roadmapPhase: 1
    applicableTests: [tests/auth-cleanup.test.ts, e2e/rc1-driver-experience.spec.ts]
    benchmark: Enterprise identity (future SSO)

